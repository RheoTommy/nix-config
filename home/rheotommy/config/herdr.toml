onboarding = false

[theme]
name = "catppuccin-latte"
auto_switch = false

[ui]
agent_panel_sort = "spaces"

show_agent_labels_on_pane_borders = true
[ui.toast]
delivery = "system"

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "$jj", "git_status"]]

# $needs_action comes from the herdr-needs-action plugin. Its fg is the
# theme's red written out, since fg takes only a hex color, not a theme's.
[ui.sidebar.agents]
rows = [
  ["state_icon", "machine", "workspace", "tab"],
  ["agent", { token = "$needs_action", fg = "#d20f39", bold = true }],
]

[keys]
focus_pane_left  = ["prefix+h", "alt+left"]
focus_pane_down  = ["prefix+j", "alt+down"]
focus_pane_up    = ["prefix+k", "alt+up"]
focus_pane_right = ["prefix+l", "alt+right"]

split_vertical = ["prefix+v", "alt+n"]

previous_tab = ["prefix+p", "alt+shift+left"]
next_tab     = ["prefix+n", "alt+shift+right"]

previous_agent = ["alt+shift+up"]
next_agent     = ["alt+shift+down"]

# One stroke, and free in fish and Claude Code, which run in the panes.
[[keys.command]]
key = "alt+a"
type = "plugin_action"
command = "rheotommy.needs-action.toggle"
description = "toggle the needs-action mark"
