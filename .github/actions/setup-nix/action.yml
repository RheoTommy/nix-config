name: Set up Nix
description: Install Nix with this flake's binary caches and cache built paths in GitHub Actions.

inputs:
  build-dir:
    description: Where Nix builds derivations; empty keeps Nix's default.
    default: ""

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      with:
        extra_nix_config: |
          extra-substituters = https://cache.numtide.com
          extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
          ${{ inputs.build-dir && format('build-dir = {0}', inputs.build-dir) || '' }}
    - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      with:
        use-flakehub: false
        diagnostic-endpoint: ""
